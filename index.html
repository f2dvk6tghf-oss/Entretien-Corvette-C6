<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Corvette C6" />
  <title>Entretien Corvette C6</title>
  <style>
    :root{
      --bg:#0b1020;
      --panel:#111827;
      --panel2:#172033;
      --text:#f8fafc;
      --muted:#9ca3af;
      --line:#293246;
      --accent:#f59e0b;
      --danger:#ef4444;
      --ok:#22c55e;
      --shadow:0 18px 45px rgba(0,0,0,.25);
      --radius:20px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#090d18,#111827 55%,#161b2b);color:var(--text)}
    button,input,select,textarea{font:inherit}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    .app{max-width:900px;margin:0 auto;padding:20px 16px 90px}
    .hero{background:linear-gradient(145deg,#1f2937,#0f172a);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
    .hero:after{content:"C6";position:absolute;right:12px;top:-18px;font-size:120px;font-weight:900;opacity:.045}
    h1{font-size:28px;margin:0 0 6px}
    .subtitle{color:var(--muted);margin:0}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
    .stat{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:13px}
    .stat b{display:block;font-size:20px}
    .stat span{font-size:12px;color:var(--muted)}
    .toolbar{display:grid;grid-template-columns:1fr auto auto;gap:10px;margin:18px 0}
    .search,.filter,button,.field input,.field select,.field textarea{
      border:1px solid var(--line);background:#0f172a;color:var(--text);border-radius:14px;padding:12px 13px;outline:none
    }
    .search{width:100%}
    button{cursor:pointer;font-weight:700}
    .primary{background:var(--accent);color:#111827;border-color:transparent}
    .secondary{background:#1f2937}
    .danger{background:#3a1820;color:#fecaca;border-color:#5b2029}
    .list{display:grid;gap:12px}
    .empty{color:var(--muted);text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:18px}
    .card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 25px rgba(0,0,0,.12)}
    .card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .card h3{margin:0 0 5px;font-size:18px}
    .meta{color:var(--muted);font-size:13px}
    .badge{display:inline-flex;align-items:center;padding:6px 9px;border-radius:999px;background:#242d40;font-size:12px;white-space:nowrap}
    .details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
    .detail{background:#0f172a;border-radius:12px;padding:10px}
    .detail strong{display:block}
    .detail span{color:var(--muted);font-size:12px}
    .notes{margin:12px 0 0;color:#d1d5db;white-space:pre-wrap}
    .actions{display:flex;gap:8px;margin-top:13px}
    .actions button{padding:9px 11px;font-size:13px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;z-index:50}
    .modal.open{display:flex}
    .sheet{width:min(100%,700px);max-height:94vh;overflow:auto;background:#111827;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
    .sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
    .sheet h2{margin:0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field.full{grid-column:1/-1}
    .field label{font-size:13px;color:#d1d5db}
    textarea{min-height:90px;resize:vertical}
    .form-actions{display:flex;gap:10px;margin-top:17px}
    .form-actions button{flex:1}
    .photo-preview{margin-top:10px;max-width:100%;border-radius:14px;display:none}
    .bottom-actions{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(8,12,23,.96) 35%);display:flex;justify-content:center}
    .bottom-inner{width:min(100%,900px);display:flex;gap:10px}
    .bottom-inner button{flex:1}
    @media(max-width:620px){
      .stats{grid-template-columns:1fr 1fr}
      .stats .stat:last-child{grid-column:1/-1}
      .toolbar{grid-template-columns:1fr 1fr}
      .toolbar .search{grid-column:1/-1}
      .grid{grid-template-columns:1fr}
      .field.full{grid-column:auto}
      .details{grid-template-columns:1fr 1fr}
    }
    @media print{
      body{background:white;color:black}
      .app{max-width:none;padding:0}
      .hero,.card{box-shadow:none;background:white;color:black;border-color:#bbb}
      .toolbar,.bottom-actions,.actions{display:none!important}
      .subtitle,.meta,.stat span,.detail span{color:#555}
      .stat,.detail{background:white;border:1px solid #ccc}
      .list{gap:8px}
      .modal{display:none!important}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>Entretien Corvette C6</h1>
      <p class="subtitle">Historique, factures et dépenses — sauvegardés sur cet iPhone.</p>
      <div class="stats">
        <div class="stat"><b id="countStat">0</b><span>interventions</span></div>
        <div class="stat"><b id="totalStat">0 €</b><span>dépenses totales</span></div>
        <div class="stat"><b id="lastKmStat">—</b><span>dernier kilométrage</span></div>
      </div>
    </section>

    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Rechercher une intervention…" />
      <select id="filter" class="filter">
        <option value="">Tous les types</option>
        <option>Vidange</option>
        <option>Révision</option>
        <option>Pneus</option>
        <option>Freinage</option>
        <option>Batterie</option>
        <option>Contrôle technique</option>
        <option>Réparation</option>
        <option>Modification</option>
        <option>Autre</option>
      </select>
      <button class="secondary" onclick="window.print()">Imprimer</button>
    </div>

    <section id="list" class="list"></section>
  </main>

  <div class="bottom-actions">
    <div class="bottom-inner">
      <button class="secondary" id="exportBtn">Sauvegarder</button>
      <button class="primary" id="addBtn">+ Ajouter</button>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="formTitle">Nouvel entretien</h2>
        <button class="secondary" id="closeBtn">Fermer</button>
      </div>
      <form id="form">
        <input type="hidden" id="editId">
        <div class="grid">
          <div class="field">
            <label>Date</label>
            <input id="date" type="date" required>
          </div>
          <div class="field">
            <label>Type</label>
            <select id="type" required>
              <option>Vidange</option>
              <option>Révision</option>
              <option>Pneus</option>
              <option>Freinage</option>
              <option>Batterie</option>
              <option>Contrôle technique</option>
              <option>Réparation</option>
              <option>Modification</option>
              <option>Autre</option>
            </select>
          </div>
          <div class="field full">
            <label>Intitulé</label>
            <input id="title" type="text" placeholder="Ex. Remplacement batterie" required>
          </div>
          <div class="field">
            <label>Kilométrage</label>
            <input id="km" type="number" inputmode="numeric" min="0" placeholder="70000">
          </div>
          <div class="field">
            <label>Montant (€)</label>
            <input id="cost" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0">
          </div>
          <div class="field full">
            <label>Garage / fournisseur</label>
            <input id="garage" type="text" placeholder="Nom du garage">
          </div>
          <div class="field full">
            <label>Notes</label>
            <textarea id="notes" placeholder="Pièces remplacées, référence, observations…"></textarea>
          </div>
          <div class="field full">
            <label>Photo de facture</label>
            <input id="photo" type="file" accept="image/*">
            <img id="photoPreview" class="photo-preview" alt="Aperçu facture">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="secondary" id="cancelBtn">Annuler</button>
          <button type="submit" class="primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

<script>
const STORAGE_KEY = "corvette_c6_entretien_v2";
let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentPhoto = "";

const $ = id => document.getElementById(id);
const money = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"}).format(Number(n||0));
const fmtDate = s => s ? new Date(s+"T12:00:00").toLocaleDateString("fr-FR") : "—";
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(items));

function render(){
  const q = $("search").value.trim().toLowerCase();
  const f = $("filter").value;
  const filtered = [...items]
    .filter(x => !f || x.type === f)
    .filter(x => [x.title,x.type,x.garage,x.notes,String(x.km),String(x.cost)].join(" ").toLowerCase().includes(q))
    .sort((a,b) => (b.date||"").localeCompare(a.date||""));

  $("countStat").textContent = items.length;
  $("totalStat").textContent = money(items.reduce((s,x)=>s+Number(x.cost||0),0));
  const maxKm = items.reduce((m,x)=>Math.max(m,Number(x.km||0)),0);
  $("lastKmStat").textContent = maxKm ? maxKm.toLocaleString("fr-FR")+" km" : "—";

  if(!filtered.length){
    $("list").innerHTML = '<div class="empty">Aucun entretien enregistré pour le moment.</div>';
    return;
  }

  $("list").innerHTML = filtered.map(x => `
    <article class="card">
      <div class="card-top">
        <div>
          <h3>${escapeHtml(x.title)}</h3>
          <div class="meta">${fmtDate(x.date)}${x.garage ? " · "+escapeHtml(x.garage) : ""}</div>
        </div>
        <span class="badge">${escapeHtml(x.type)}</span>
      </div>
      <div class="details">
        <div class="detail"><strong>${x.km ? Number(x.km).toLocaleString("fr-FR")+" km" : "—"}</strong><span>Kilométrage</span></div>
        <div class="detail"><strong>${money(x.cost)}</strong><span>Montant</span></div>
        <div class="detail"><strong>${x.photo ? "Oui" : "Non"}</strong><span>Facture</span></div>
      </div>
      ${x.notes ? `<p class="notes">${escapeHtml(x.notes)}</p>` : ""}
      ${x.photo ? `<img src="${x.photo}" alt="Facture" style="width:100%;margin-top:12px;border-radius:14px">` : ""}
      <div class="actions">
        <button class="secondary" onclick="editItem('${x.id}')">Modifier</button>
        <button class="danger" onclick="deleteItem('${x.id}')">Supprimer</button>
      </div>
    </article>
  `).join("");
}

function escapeHtml(v=""){
  return String(v).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function openModal(item=null){
  $("formTitle").textContent = item ? "Modifier l’entretien" : "Nouvel entretien";
  $("editId").value = item?.id || "";
  $("date").value = item?.date || new Date().toISOString().slice(0,10);
  $("type").value = item?.type || "Vidange";
  $("title").value = item?.title || "";
  $("km").value = item?.km || "";
  $("cost").value = item?.cost || "";
  $("garage").value = item?.garage || "";
  $("notes").value = item?.notes || "";
  currentPhoto = item?.photo || "";
  $("photo").value = "";
  $("photoPreview").src = currentPhoto;
  $("photoPreview").style.display = currentPhoto ? "block" : "none";
  $("modal").classList.add("open");
  $("modal").setAttribute("aria-hidden","false");
}

function closeModal(){
  $("modal").classList.remove("open");
  $("modal").setAttribute("aria-hidden","true");
}

function editItem(id){
  const item = items.find(x=>x.id===id);
  if(item) openModal(item);
}
function deleteItem(id){
  if(confirm("Supprimer définitivement cet entretien ?")){
    items = items.filter(x=>x.id!==id);
    save(); render();
  }
}

$("photo").addEventListener("change", e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    currentPhoto = reader.result;
    $("photoPreview").src = currentPhoto;
    $("photoPreview").style.display = "block";
  };
  reader.readAsDataURL(file);
});

$("form").addEventListener("submit", e=>{
  e.preventDefault();
  const id = $("editId").value || (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
  const obj = {
    id,
    date:$("date").value,
    type:$("type").value,
    title:$("title").value.trim(),
    km:Number($("km").value||0),
    cost:Number($("cost").value||0),
    garage:$("garage").value.trim(),
    notes:$("notes").value.trim(),
    photo:currentPhoto
  };
  const idx = items.findIndex(x=>x.id===id);
  if(idx>=0) items[idx]=obj; else items.push(obj);
  try{
    save();
  }catch(err){
    alert("La photo est trop lourde pour le stockage de l’iPhone. Réessaie avec une photo moins volumineuse.");
    return;
  }
  closeModal(); render();
});

$("exportBtn").addEventListener("click", ()=>{
  const blob = new Blob([JSON.stringify(items,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "sauvegarde-corvette-c6.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

$("addBtn").addEventListener("click", ()=>openModal());
$("closeBtn").addEventListener("click", closeModal);
$("cancelBtn").addEventListener("click", closeModal);
$("modal").addEventListener("click", e=>{ if(e.target === $("modal")) closeModal(); });
$("search").addEventListener("input", render);
$("filter").addEventListener("change", render);

render();
</script>
</body>
</html>
